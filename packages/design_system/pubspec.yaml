name: auto_skola_design_system
description: Shared visual foundations for Auto Skola 365.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: SchoolSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
