services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-skola-365-postgres
    environment:
      POSTGRES_DB: auto_skola_365
      POSTGRES_USER: auto_skola_365
      POSTGRES_PASSWORD: auto_skola_365
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_skola_365 -d auto_skola_365"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
