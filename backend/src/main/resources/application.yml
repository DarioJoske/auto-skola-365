spring:
  application:
    name: auto-skola-365-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/auto_skola_365}
    username: ${DATABASE_USERNAME:auto_skola_365}
    password: ${DATABASE_PASSWORD:auto_skola_365}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

management:
  endpoints:
    web:
      exposure:
        include: health,info
